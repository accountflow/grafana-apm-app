# Accountflow fork release. Builds the plugin from a fork tag and publishes an
# UNSIGNED nais-apm-app-<version>.zip + .zip.sha1 as a GitHub Release on this fork.
#
# Why not release.yml: grafana/plugin-actions/build-plugin has an unconditional
# "Check package version" gate requiring the tag to be exactly `v<version>`, so
# it rejects our `nais-apm-app-v<version>` tag shape (nais's release-please.yml
# documents the same limitation). Why not release-please.yml: it would open
# Release PRs on `main` and mint tags that collide with upstream; it is disabled
# on the fork. This workflow reproduces the build/package/validate steps of
# release-please.yml's `publish` job, minus signing (no GRAFANA_ACCESS_POLICY_TOKEN
# here; Accountflow's Grafana loads the plugin unsigned) and minus attestation.
#
# See FORK.md for the release procedure and the exit criterion for this fork.
name: Release (Accountflow fork)

on:
  push:
    tags:
      - 'nais-apm-app-v*-accountflow.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Fork release tag to (re)build and publish, e.g. nais-apm-app-v0.24.0-accountflow.1'
        required: true
        type: string

permissions: read-all

concurrency:
  group: release-fork-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its assets
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Enable corepack
        run: corepack enable
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v6
        with:
          node-version: '22.23.4'
          cache: 'pnpm'
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # ratchet:actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify package version matches release tag
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED="${RELEASE_TAG#nais-apm-app-}"
          EXPECTED="${EXPECTED#v}"
          if [ "$PKG_VERSION" != "$EXPECTED" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match release tag $RELEASE_TAG (expected version $EXPECTED)."
            exit 1
          fi
          echo "package.json version $PKG_VERSION matches release tag $RELEASE_TAG"

      - name: Build frontend
        run: pnpm run build

      - name: Build backend
        uses: magefile/mage-action@a662bd8c29d8106879588cfff83b2faf6e6f59db # ratchet:magefile/mage-action@v4.0.0
        with:
          version: latest
          args: buildAll

      - name: Get plugin metadata
        id: metadata
        run: |
          GRAFANA_PLUGIN_ID=$(jq -r .id dist/plugin.json)
          GRAFANA_PLUGIN_VERSION=$(jq -r .info.version dist/plugin.json)
          GRAFANA_PLUGIN_ARTIFACT="${GRAFANA_PLUGIN_ID}-${GRAFANA_PLUGIN_VERSION}.zip"
          echo "plugin-id=${GRAFANA_PLUGIN_ID}" >> "$GITHUB_OUTPUT"
          echo "plugin-version=${GRAFANA_PLUGIN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "archive=${GRAFANA_PLUGIN_ARTIFACT}" >> "$GITHUB_OUTPUT"

      # Same asset shape as nais releases: <zip> plus a .sha1 file holding the
      # bare hex digest (what iac's NAIS_APM_PLUGIN_SHA1 expects).
      - name: Package plugin
        run: |
          mv dist "${PLUGIN_ID}"
          zip "${ARCHIVE}" "${PLUGIN_ID}" -r
          sha1sum "${ARCHIVE}" | cut -d' ' -f1 > "${ARCHIVE}.sha1"
          echo "sha1: $(cat "${ARCHIVE}.sha1")"
        env:
          ARCHIVE: ${{ steps.metadata.outputs.archive }}
          PLUGIN_ID: ${{ steps.metadata.outputs.plugin-id }}

      - name: Validate plugin
        run: |
          docker run --pull=always \
            -v "$PWD/${ARCHIVE}:/archive.zip" \
            grafana/plugin-validator-cli -analyzer=metadatavalid /archive.zip
        env:
          ARCHIVE: ${{ steps.metadata.outputs.archive }}

      # Create the release on first run; on a re-run the release already exists,
      # so fall back to replacing its assets (--clobber keeps this idempotent).
      - name: Publish GitHub release
        run: |
          NOTES="Accountflow fork build of nais-apm-app ${PLUGIN_VERSION}: unsigned, with @grafana/rrweb-player replaced by upstream rrweb-player@2.1.4 so session replay plays back. Why and how: https://github.com/${GITHUB_REPOSITORY}/blob/accountflow/FORK.md"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ARCHIVE" "$ARCHIVE.sha1" --clobber
          else
            gh release create "$RELEASE_TAG" "$ARCHIVE" "$ARCHIVE.sha1" \
              --title "$RELEASE_TAG" \
              --notes "$NOTES" \
              --prerelease
          fi
          echo "url: https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${ARCHIVE}"
          echo "sha1: $(cat "$ARCHIVE.sha1")"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCHIVE: ${{ steps.metadata.outputs.archive }}
          PLUGIN_VERSION: ${{ steps.metadata.outputs.plugin-version }}
